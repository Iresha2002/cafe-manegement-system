services:
  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cafe-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

  # Frontend React UI service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cafe-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend